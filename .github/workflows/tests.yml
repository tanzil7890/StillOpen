name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the logs are not downloaded here, so the test that reruns one is skipped
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install numpy scipy scikit-learn pytest
      - run: pytest -q
